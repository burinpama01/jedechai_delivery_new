# Flutter Native Splash configuration
flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo_bg.png"
  android_12:
    image: "assets/images/logo_bg.png"
    icon_background_color: "#ffffff"

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path_android: "assets/images/logo_512.png"
  image_path_ios: "assets/images/logo_1024.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo_512.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env.client
    - assets/images/
  fonts:
    # ฟอนต์ตามดีไซน์ JDC (สัญญาอนุญาต OFL — สำเนาอยู่ใน assets/fonts/)
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
    # Noto Sans Thai เผยแพร่เป็น variable font น้ำหนักคุมผ่าน FontVariation ในธีม
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Variable.ttf
