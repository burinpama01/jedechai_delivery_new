<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทดสอบ Admin GP ด้วยข้อมูลจำลอง</title><style>body{font:16px/1.65 system-ui;background:#f5f7fa;margin:24px;color:#17233a}button,input,textarea{font:inherit;min-height:48px}button{cursor:pointer;margin:4px;padding:8px 16px}dialog{width:min(92vw,680px);max-height:85vh;overflow:auto;border:1px solid #ccd5df;border-radius:16px;padding:20px}dialog::backdrop{background:#17233a66}input,textarea{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:8px}article{border:1px solid #ccd5df;padding:12px;border-radius:12px;margin:12px 0}p{overflow-wrap:anywhere}[data-error]{color:#a32424}label{display:block}.whitespace-pre-wrap{white-space:pre-wrap}</style></head><body><h1>ทดสอบข้อเสนอ GP · ข้อมูลจำลองเท่านั้น</h1><p>หน้านี้ใช้ module จริงของ Admin Web แต่ไม่มีการเชื่อมต่อฐานข้อมูลหรือบัญชีจริง</p><div id="fixture"><button data-gp-proposal-merchant="fixture">ดูข้อเสนอ GP</button></div><p id="result" role="status"></p><script type="module">
import {bindProposalActions} from '../../admin-web/src/pages/merchantGpProposals.js';
const rows=[{id:'round-2',merchant_id:'fixture',revision:2,status:'pending',gp_rate:0.12,base_delivery_fee:12,base_distance_km:5,per_km_charge:4,merchant_note:'ขอปรับเงื่อนไขค่าส่งเพื่อให้เหมาะสมกับพื้นที่',created_at:'2026-09-30T12:00:00Z'}, {id:'round-1',revision:1,status:'returned',gp_rate:0.1,base_delivery_fee:10,base_distance_km:5,per_km_charge:3,rejection_reason:'กรุณาทบทวนค่าส่งส่วนเกิน พร้อมอธิบายเหตุผลประกอบ',created_at:'2026-09-30T10:00:00Z',reviewed_at:'2026-09-30T11:00:00Z'}];
bindProposalActions(document.getElementById('fixture'),{supabase:{from:()=>({select:()=>({eq:()=>({order:async()=>({data:rows,error:null})})})}),rpc:async(_,args)=>{rows[0].status=args.p_decision;rows[0].rejection_reason=args.p_reason;document.getElementById('result').textContent=`ผลจำลอง: ${args.p_decision} · ${args.p_reason || 'อนุมัติเงื่อนไขแล้ว'}`;return {data:{success:true}}}},showToast:(message)=>{document.getElementById('result').textContent+=' · '+message},refreshCurrentPage:()=>{}});
</script></body></html>
