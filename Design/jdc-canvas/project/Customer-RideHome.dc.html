<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ลูกค้า — เรียกรถ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --paper:#f4f7f4;--surface:#ffffff;--sunken:#eef2ee;--line:#dbe4de;
  --text:#0f3b33;--muted:#5c6f68;--dim:#66736d;
  --panel:#0f3b33;--on-panel:#ffffff;--panel-dim:#b7cfc8;
  --panel-soft:rgba(255,255,255,.10);--panel-soft2:rgba(255,255,255,.12);--panel-soft3:rgba(255,255,255,.14);--panel-line:rgba(255,255,255,.24);--bar-dim:rgba(255,255,255,.26);
  --brand:#e39c2e;--brand-hi:#f3c06a;--cta:#8a5a0a;--on-cta:#ffffff;--link:#8a5a0a;--link-hover:#6d4708;
  --brand-soft:#fff3dc;--brand-soft2:#fffaf0;--brand-line:#f0cf95;--brand-on-soft:#8a5a0a;
  --green-ink:#2b6b2b;--green-soft:#e6f4e2;--green-line:#bfe0b6;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.30);--green-panel-line:rgba(95,207,122,.45);
  --teal-soft:#e2f1ef;--teal-ink:#16605a;
  --danger:#b42318;--danger-ink:#8f1c14;--danger-soft:#ffece9;--danger-line:#f0b3ab;
  --off-track:#c3ccc6;--knob:#ffffff;--track-empty:#e1e8e3;
  --map-bg:#dfe7e2;--map-grid:#d4ded8;--map-road:#ffffff;--route:#8a5a0a;
  --hero:linear-gradient(132deg,#0e382f 0%,#1d5f50 55%,#8a5a0a 150%);
  --hero2:linear-gradient(140deg,#0e382f 0%,#1a5548 70%);
  --hero3:linear-gradient(140deg,#0e382f 0%,#20655a 55%,#8a5a0a 140%);
  --sh-card:0 6px 18px rgba(12,44,37,.07);--sh-raise:0 12px 30px rgba(12,44,37,.10);--sh-float:0 6px 16px rgba(12,44,37,.16);--sh-deep:0 10px 24px rgba(12,44,37,.30);--sh-sheet:0 -10px 30px rgba(12,44,37,.08);--sh-brand:0 10px 26px rgba(227,156,46,.22);--sh-brand-lg:0 14px 34px rgba(227,156,46,.26);
}
/* โหมดมืด: ตอนนี้ปิดการสลับอัตโนมัติไว้ เปิดได้โดยใส่ data-theme="dark" ที่ :root */
:root[data-theme="dark"]{
  --paper:#0b1a17;--surface:#12241f;--sunken:#0e1f1b;--line:#24403a;
  --text:#e8f1ed;--muted:#9cb1a9;--dim:#8fa39c;
  --panel:#16352e;--on-panel:#f2f8f5;--panel-dim:#9ab6ae;
  --panel-soft:rgba(255,255,255,.08);--panel-soft2:rgba(255,255,255,.10);--panel-soft3:rgba(255,255,255,.12);--panel-line:rgba(255,255,255,.18);--bar-dim:rgba(255,255,255,.24);
  --brand:#e0a53f;--brand-hi:#f3c06a;--cta:#a0690f;--on-cta:#ffffff;--link:#edbb62;--link-hover:#f6d493;
  --brand-soft:#2a2114;--brand-soft2:#241d12;--brand-line:#4a3a1c;--brand-on-soft:#edbb62;
  --green-ink:#85cf82;--green-soft:#14301c;--green-line:#26512a;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.32);--green-panel-line:rgba(95,207,122,.40);
  --teal-soft:#0f2a28;--teal-ink:#6fc3ba;
  --danger:#ff8a7d;--danger-ink:#ff9a8e;--danger-soft:#351a17;--danger-line:#55302b;
  --off-track:#3a4d47;--knob:#f2f8f5;--track-empty:#24403a;
  --map-bg:#17302a;--map-grid:#1e3b34;--map-road:#25453d;--route:#e0a53f;
  --hero:linear-gradient(132deg,#0a2621 0%,#134137 55%,#5e3f0b 150%);
  --hero2:linear-gradient(140deg,#0a2621 0%,#123b33 70%);
  --hero3:linear-gradient(140deg,#0a2621 0%,#154439 55%,#5e3f0b 140%);
  --sh-card:0 6px 18px rgba(0,0,0,.40);--sh-raise:0 12px 30px rgba(0,0,0,.45);--sh-float:0 6px 16px rgba(0,0,0,.45);--sh-deep:0 10px 24px rgba(0,0,0,.55);--sh-sheet:0 -10px 30px rgba(0,0,0,.40);--sh-brand:0 10px 26px rgba(0,0,0,.45);--sh-brand-lg:0 14px 34px rgba(0,0,0,.50);
}
body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;margin:0}
.dsp{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); overflow: hidden;">

  <div style="flex-shrink: 0; height: 300px; position: relative; background: var(--map-bg); overflow: hidden;">
    <div style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--map-grid) 0 1px, transparent 1px 46px), repeating-linear-gradient(0deg, var(--map-grid) 0 1px, transparent 1px 46px);"></div>
    <div style="position: absolute; left: -30px; top: 176px; width: 470px; height: 16px; background: var(--map-road); transform: rotate(-5deg);"></div>
    <div style="position: absolute; left: 150px; top: -40px; width: 14px; height: 390px; background: var(--map-road); transform: rotate(9deg);"></div>
    <svg width="390" height="300" viewBox="0 0 390 300" fill="none" style="position: absolute; inset: 0;" aria-hidden="true">
      <path d="M118 212c48 0 58-52 104-64s86-8 118-32" stroke="currentColor" style="color: var(--route);" stroke-width="5" stroke-linecap="round"></path>
    </svg>
    <span style="position: absolute; left: 106px; top: 200px; width: 14px; height: 14px; border-radius: 999px; background: var(--panel); border: 3px solid var(--map-road); box-shadow: var(--sh-float);"></span>
    <span style="position: absolute; left: 330px; top: 106px; width: 14px; height: 14px; border-radius: 3px; background: var(--cta); border: 3px solid var(--map-road); box-shadow: var(--sh-float);"></span>

    <div style="position: absolute; top: 16px; left: 20px; right: 20px; display: flex; align-items: center; gap: 10px;">
      <a href="Main.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: var(--sh-float); display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <span style="flex-grow: 1;"></span>
      <a href="Customer-MapPicker.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 15px; border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: var(--sh-float); font-size: 13px; font-weight: 700;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.3 7-11a7 7 0 1 0-14 0c0 5.7 7 11 7 11z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>
        ปักหมุดบนแผนที่
      </a>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; margin-top: -22px; padding: 20px; border-radius: 24px 24px 0 0; background: var(--surface); box-shadow: var(--sh-sheet); display: flex; flex-direction: column; gap: 16px;">

    <h1 style="font-size: 19px; font-weight: 700;">จะไปไหนดี</h1>

    <div style="display: flex; gap: 12px;">
      <span style="display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; padding-top: 16px;">
        <span style="width: 11px; height: 11px; border-radius: 999px; border: 3px solid var(--panel);"></span>
        <span style="flex-grow: 1; width: 2px; background: var(--line); min-height: 26px;"></span>
        <span style="width: 11px; height: 11px; border-radius: 3px; background: var(--cta);"></span>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0;">
        <button type="button" style="min-height: 48px; padding: 0 14px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-align: left; font-size: 14px; font-weight: 600;">ตำแหน่งปัจจุบันของฉัน</button>
        <button type="button" style="min-height: 48px; padding: 0 14px; border-radius: 13px; border: 1px solid var(--brand-line); background: var(--brand-soft2); color: var(--text); text-align: left; font-size: 14px; font-weight: 600;">เซ็นทรัลขอนแก่น</button>
      </span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="font-size: 13px; font-weight: 700; color: var(--muted);">เลือกประเภทรถ</h2>
      <sc-for list="{{cars}}" as="c" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 15px; background: {{c.bg}}; border: 2px solid {{c.line}};">
          <span style="width: 42px; height: 42px; border-radius: 12px; background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16.4v-3.2l1.8-4A2 2 0 0 1 7.6 8h8.8a2 2 0 0 1 1.8 1.2l1.8 4v3.2"></path><path d="M5 16.4h14"></path><circle cx="7.6" cy="16.6" r="1.6"></circle><circle cx="16.4" cy="16.6" r="1.6"></circle></svg>
          </span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-size: 14px; font-weight: 700;">{{c.name}}</span>
            <span style="font-size: 12px; color: var(--muted);">{{c.meta}}</span>
          </span>
          <span class="dsp" style="font-size: 17px; font-weight: 700;">{{c.price}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 13px; background: var(--sunken);">
      <span style="flex-grow: 1; font-size: 12px; color: var(--muted);">ระยะทาง 5.2 กม. · ค่ารับต้นทาง ฿10</span>
      <a href="Customer-Coupons.dc.html" style="font-size: 12px; font-weight: 700;">ใช้คูปอง</a>
    </div>

    <span style="flex-grow: 1;"></span>

    <a href="Customer-RideService.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: var(--cta); color: var(--on-cta); font-size: 16px; font-weight: 700;">เรียกมอเตอร์ไซค์ · ฿65</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cars: [
        { name: 'มอเตอร์ไซค์', meta: '1 ที่นั่ง · เร็วที่สุด · ถึงใน 4 นาที', price: '฿65', bg: 'var(--brand-soft2)', line: 'var(--brand)' },
        { name: 'รถยนต์', meta: '4 ที่นั่ง · แอร์เย็น · ถึงใน 9 นาที', price: '฿145', bg: 'var(--surface)', line: 'var(--line)' }
      ]
    };
  }
}
</script>
</body>
</html>
