<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ร้านค้า — จัดการเมนู</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --paper:#f4f7f4;--surface:#ffffff;--sunken:#eef2ee;--line:#dbe4de;
  --text:#0f3b33;--muted:#5c6f68;--dim:#66736d;
  --panel:#0f3b33;--on-panel:#ffffff;--panel-dim:#b7cfc8;
  --panel-soft:rgba(255,255,255,.10);--panel-soft2:rgba(255,255,255,.12);--panel-soft3:rgba(255,255,255,.14);--panel-line:rgba(255,255,255,.24);--bar-dim:rgba(255,255,255,.26);
  --brand:#e39c2e;--brand-hi:#f3c06a;--cta:#8a5a0a;--on-cta:#ffffff;--link:#8a5a0a;--link-hover:#6d4708;
  --brand-soft:#fff3dc;--brand-soft2:#fffaf0;--brand-line:#f0cf95;--brand-on-soft:#8a5a0a;
  --green-ink:#2b6b2b;--green-soft:#e6f4e2;--green-line:#bfe0b6;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.30);--green-panel-line:rgba(95,207,122,.45);
  --teal-soft:#e2f1ef;--teal-ink:#16605a;
  --danger:#b42318;--danger-ink:#8f1c14;--danger-soft:#ffece9;--danger-line:#f0b3ab;
  --off-track:#c3ccc6;--knob:#ffffff;--track-empty:#e1e8e3;
  --map-bg:#dfe7e2;--map-grid:#d4ded8;--map-road:#ffffff;--route:#8a5a0a;
  --hero:linear-gradient(132deg,#0e382f 0%,#1d5f50 55%,#8a5a0a 150%);
  --hero2:linear-gradient(140deg,#0e382f 0%,#1a5548 70%);
  --hero3:linear-gradient(140deg,#0e382f 0%,#20655a 55%,#8a5a0a 140%);
  --sh-card:0 6px 18px rgba(12,44,37,.07);--sh-raise:0 12px 30px rgba(12,44,37,.10);--sh-float:0 6px 16px rgba(12,44,37,.16);--sh-deep:0 10px 24px rgba(12,44,37,.30);--sh-sheet:0 -10px 30px rgba(12,44,37,.08);--sh-brand:0 10px 26px rgba(227,156,46,.22);--sh-brand-lg:0 14px 34px rgba(227,156,46,.26);
}
/* โหมดมืด: ตอนนี้ปิดการสลับอัตโนมัติไว้ เปิดได้โดยใส่ data-theme="dark" ที่ :root */
:root[data-theme="dark"]{
  --paper:#0b1a17;--surface:#12241f;--sunken:#0e1f1b;--line:#24403a;
  --text:#e8f1ed;--muted:#9cb1a9;--dim:#8fa39c;
  --panel:#16352e;--on-panel:#f2f8f5;--panel-dim:#9ab6ae;
  --panel-soft:rgba(255,255,255,.08);--panel-soft2:rgba(255,255,255,.10);--panel-soft3:rgba(255,255,255,.12);--panel-line:rgba(255,255,255,.18);--bar-dim:rgba(255,255,255,.24);
  --brand:#e0a53f;--brand-hi:#f3c06a;--cta:#a0690f;--on-cta:#ffffff;--link:#edbb62;--link-hover:#f6d493;
  --brand-soft:#2a2114;--brand-soft2:#241d12;--brand-line:#4a3a1c;--brand-on-soft:#edbb62;
  --green-ink:#85cf82;--green-soft:#14301c;--green-line:#26512a;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.32);--green-panel-line:rgba(95,207,122,.40);
  --teal-soft:#0f2a28;--teal-ink:#6fc3ba;
  --danger:#ff8a7d;--danger-ink:#ff9a8e;--danger-soft:#351a17;--danger-line:#55302b;
  --off-track:#3a4d47;--knob:#f2f8f5;--track-empty:#24403a;
  --map-bg:#17302a;--map-grid:#1e3b34;--map-road:#25453d;--route:#e0a53f;
  --hero:linear-gradient(132deg,#0a2621 0%,#134137 55%,#5e3f0b 150%);
  --hero2:linear-gradient(140deg,#0a2621 0%,#123b33 70%);
  --hero3:linear-gradient(140deg,#0a2621 0%,#154439 55%,#5e3f0b 140%);
  --sh-card:0 6px 18px rgba(0,0,0,.40);--sh-raise:0 12px 30px rgba(0,0,0,.45);--sh-float:0 6px 16px rgba(0,0,0,.45);--sh-deep:0 10px 24px rgba(0,0,0,.55);--sh-sheet:0 -10px 30px rgba(0,0,0,.40);--sh-brand:0 10px 26px rgba(0,0,0,.45);--sh-brand-lg:0 14px 34px rgba(0,0,0,.50);
}
body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;margin:0}
.dsp{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); overflow: hidden;">

  <div style="flex-shrink: 0; padding: 16px 20px 14px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <h1 style="flex-grow: 1; font-size: 19px; font-weight: 700;">จัดการเมนู</h1>
      <a href="Merchant-OptionLibrary.dc.html" style="min-height: 40px; display: flex; align-items: center; padding: 0 13px; border-radius: 12px; border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--text);">ตัวเลือกเสริม</a>
    </div>
    <label for="q-menu" class="vh">ค้นหาเมนู</label>
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      <input id="q-menu" type="search" placeholder="ค้นหาเมนูในร้าน" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; color: var(--text);">
    </div>
    <div style="display: flex; gap: 8px;">
      <span style="padding: 8px 13px; border-radius: 999px; background: var(--panel); color: var(--on-panel); font-size: 12px; font-weight: 700;">ทั้งหมด 42</span>
      <span style="padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600;">ข้าวจานเดียว</span>
      <span style="padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600;">ก๋วยเตี๋ยว</span>
      <span style="padding: 8px 13px; border-radius: 999px; border: 1px solid var(--danger-line); background: var(--danger-soft); color: var(--danger-ink); font-size: 12px; font-weight: 700;">หมด 3</span>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <h2 style="flex-grow: 1; font-size: 13px; font-weight: 700; color: var(--muted);">ข้าวจานเดียว · 12 เมนู</h2>
      <a href="Merchant-MenuCategories.dc.html" style="font-size: 12px; font-weight: 700;">จัดลำดับ</a>
    </div>

    <sc-for list="{{items}}" as="m" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);">
        <span class="dsp" style="width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; background: {{m.bg}}; color: {{m.fg}};">{{m.tag}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 700; color: {{m.nameColor}};">{{m.name}}</span>
          <span style="font-size: 12px; color: var(--muted);">{{m.meta}}</span>
        </span>
        <span class="dsp" style="font-size: 14px; font-weight: 700; color: {{m.nameColor}};">{{m.price}}</span>
        <button type="button" role="switch" aria-checked="{{m.on}}" aria-label="เปิดขายเมนูนี้" style="width: 46px; height: 28px; flex-shrink: 0; border-radius: 999px; border: 0; padding: 3px; display: flex; align-items: center; background: {{m.track}}; justify-content: {{m.knob}};">
          <span style="width: 22px; height: 22px; border-radius: 999px; background: var(--knob);"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 12px; background: var(--surface); border-top: 1px solid var(--line);">
    <a href="Merchant-AddEditMenu.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 16px; background: var(--panel); color: var(--on-panel); font-size: 15px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12"></path><path d="M6 12h12"></path></svg>
      เพิ่มเมนูใหม่
    </a>
  </div>
  <nav style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 18px; background: var(--surface); border-top: 1px solid var(--line);">
    <a href="Merchant-Orders.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 10px; font-weight: 600;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8z"></path><path d="M9.5 9h5"></path><path d="M9.5 13h5"></path></svg>ออเดอร์</a>
    <a href="Merchant-Laundry.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 10px; font-weight: 600;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.6"></rect><circle cx="12" cy="14" r="3.9"></circle></svg>ซักผ้า</a>
    <span aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--link); font-size: 10px; font-weight: 700;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--link);" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5v17"></path><path d="M4 3.5v5a2 2 0 0 0 4 0v-5"></path><path d="M16.5 3.5c-1.6 1-2.5 2.8-2.5 5s1 3 2.5 3H18V3.5z"></path><path d="M18 11.5v9"></path></svg>เมนู</span>
    <a href="Merchant-Dashboard.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 10px; font-weight: 600;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12"></path><path d="M12 20V5"></path><path d="M19 20v-6"></path></svg>รายงาน</a>
    <a href="Merchant-Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 10px; font-weight: 600;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>บัญชี</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { on: 'true', track: 'var(--green-fill)', knob: 'flex-end', nameColor: 'var(--text)' };
    const off = { on: 'false', track: 'var(--off-track)', knob: 'flex-start', nameColor: 'var(--dim)' };
    return {
      items: [
        { tag: 'กพ', bg: 'var(--brand-soft)', fg: 'var(--brand-on-soft)', name: 'ข้าวกะเพราหมูสับ', meta: '3 ตัวเลือกเสริม · ขายดี', price: '฿55', ...on },
        { tag: 'กด', bg: 'var(--brand-soft)', fg: 'var(--brand-on-soft)', name: 'ข้าวกะเพราหมูสับไข่ดาว', meta: '3 ตัวเลือกเสริม', price: '฿65', ...on },
        { tag: 'ผอ', bg: 'var(--teal-soft)', fg: 'var(--teal-ink)', name: 'ข้าวผัดอเมริกัน', meta: '2 ตัวเลือกเสริม', price: '฿85', ...on },
        { tag: 'คห', bg: 'var(--sunken)', fg: 'var(--muted)', name: 'ข้าวหมูกรอบ', meta: 'ของหมด · ซ่อนจากลูกค้า', price: '฿70', ...off },
        { tag: 'ขไ', bg: 'var(--green-soft)', fg: 'var(--green-ink)', name: 'ข้าวไข่เจียวหมูสับ', meta: '1 ตัวเลือกเสริม', price: '฿50', ...on }
      ]
    };
  }
}
</script>
</body>
</html>
