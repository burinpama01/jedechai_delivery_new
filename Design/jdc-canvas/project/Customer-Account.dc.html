<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ลูกค้า — บัญชี</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --paper:#f4f7f4;--surface:#ffffff;--sunken:#eef2ee;--line:#dbe4de;
  --text:#0f3b33;--muted:#5c6f68;--dim:#66736d;
  --panel:#0f3b33;--on-panel:#ffffff;--panel-dim:#b7cfc8;
  --panel-soft:rgba(255,255,255,.10);--panel-soft2:rgba(255,255,255,.12);--panel-soft3:rgba(255,255,255,.14);--panel-line:rgba(255,255,255,.24);--bar-dim:rgba(255,255,255,.26);
  --brand:#e39c2e;--brand-hi:#f3c06a;--cta:#8a5a0a;--on-cta:#ffffff;--link:#8a5a0a;--link-hover:#6d4708;
  --brand-soft:#fff3dc;--brand-soft2:#fffaf0;--brand-line:#f0cf95;--brand-on-soft:#8a5a0a;
  --green-ink:#2b6b2b;--green-soft:#e6f4e2;--green-line:#bfe0b6;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.30);--green-panel-line:rgba(95,207,122,.45);
  --teal-soft:#e2f1ef;--teal-ink:#16605a;
  --danger:#b42318;--danger-ink:#8f1c14;--danger-soft:#ffece9;--danger-line:#f0b3ab;
  --off-track:#c3ccc6;--knob:#ffffff;--track-empty:#e1e8e3;
  --map-bg:#dfe7e2;--map-grid:#d4ded8;--map-road:#ffffff;--route:#8a5a0a;
  --hero:linear-gradient(132deg,#0e382f 0%,#1d5f50 55%,#8a5a0a 150%);
  --hero2:linear-gradient(140deg,#0e382f 0%,#1a5548 70%);
  --hero3:linear-gradient(140deg,#0e382f 0%,#20655a 55%,#8a5a0a 140%);
  --sh-card:0 6px 18px rgba(12,44,37,.07);--sh-raise:0 12px 30px rgba(12,44,37,.10);--sh-float:0 6px 16px rgba(12,44,37,.16);--sh-deep:0 10px 24px rgba(12,44,37,.30);--sh-sheet:0 -10px 30px rgba(12,44,37,.08);--sh-brand:0 10px 26px rgba(227,156,46,.22);--sh-brand-lg:0 14px 34px rgba(227,156,46,.26);
}
/* โหมดมืด: ตอนนี้ปิดการสลับอัตโนมัติไว้ เปิดได้โดยใส่ data-theme="dark" ที่ :root */
:root[data-theme="dark"]{
  --paper:#0b1a17;--surface:#12241f;--sunken:#0e1f1b;--line:#24403a;
  --text:#e8f1ed;--muted:#9cb1a9;--dim:#8fa39c;
  --panel:#16352e;--on-panel:#f2f8f5;--panel-dim:#9ab6ae;
  --panel-soft:rgba(255,255,255,.08);--panel-soft2:rgba(255,255,255,.10);--panel-soft3:rgba(255,255,255,.12);--panel-line:rgba(255,255,255,.18);--bar-dim:rgba(255,255,255,.24);
  --brand:#e0a53f;--brand-hi:#f3c06a;--cta:#a0690f;--on-cta:#ffffff;--link:#edbb62;--link-hover:#f6d493;
  --brand-soft:#2a2114;--brand-soft2:#241d12;--brand-line:#4a3a1c;--brand-on-soft:#edbb62;
  --green-ink:#85cf82;--green-soft:#14301c;--green-line:#26512a;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.32);--green-panel-line:rgba(95,207,122,.40);
  --teal-soft:#0f2a28;--teal-ink:#6fc3ba;
  --danger:#ff8a7d;--danger-ink:#ff9a8e;--danger-soft:#351a17;--danger-line:#55302b;
  --off-track:#3a4d47;--knob:#f2f8f5;--track-empty:#24403a;
  --map-bg:#17302a;--map-grid:#1e3b34;--map-road:#25453d;--route:#e0a53f;
  --hero:linear-gradient(132deg,#0a2621 0%,#134137 55%,#5e3f0b 150%);
  --hero2:linear-gradient(140deg,#0a2621 0%,#123b33 70%);
  --hero3:linear-gradient(140deg,#0a2621 0%,#154439 55%,#5e3f0b 140%);
  --sh-card:0 6px 18px rgba(0,0,0,.40);--sh-raise:0 12px 30px rgba(0,0,0,.45);--sh-float:0 6px 16px rgba(0,0,0,.45);--sh-deep:0 10px 24px rgba(0,0,0,.55);--sh-sheet:0 -10px 30px rgba(0,0,0,.40);--sh-brand:0 10px 26px rgba(0,0,0,.45);--sh-brand-lg:0 14px 34px rgba(0,0,0,.50);
}
body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;margin:0}
.dsp{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); overflow: hidden;">

  <div style="flex-shrink: 0; padding: 22px 20px 20px; background: var(--hero); color: var(--on-panel); display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span class="dsp" style="width: 56px; height: 56px; border-radius: 999px; background: var(--panel-soft3); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0;">บร</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 17px; font-weight: 700;">บุรินทร์ ป.</span>
        <span style="font-size: 12px; color: var(--panel-dim);">08x-xxx-4567</span>
      </span>
      <a href="Customer-Profile.dc.html" style="min-height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; border: 1px solid var(--panel-line); background: var(--panel-soft2); color: var(--on-panel); font-size: 12px; font-weight: 700;">แก้ไข</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <a href="Customer-Wallet.dc.html" style="padding: 12px 14px; border-radius: 14px; background: var(--panel-soft); color: var(--on-panel); display: flex; flex-direction: column; gap: 2px;">
        <span class="dsp" style="font-size: 18px; font-weight: 700;">฿1,240.00</span>
        <span style="font-size: 11px; color: var(--panel-dim);">JDC Wallet</span>
      </a>
      <a href="Customer-Coupons.dc.html" style="padding: 12px 14px; border-radius: 14px; background: var(--panel-soft); color: var(--on-panel); display: flex; flex-direction: column; gap: 2px;">
        <span class="dsp" style="font-size: 18px; font-weight: 700;">3 ใบ</span>
        <span style="font-size: 11px; color: var(--panel-dim);">คูปองพร้อมใช้</span>
      </a>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="font-size: 12px; font-weight: 700; color: var(--muted);">{{g.title}}</h2>
        <div style="border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden;">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" style="display: flex; align-items: center; gap: 12px; padding: 13px 15px; color: var(--text); border-bottom: 1px solid var(--line);">
              <span style="width: 34px; height: 34px; border-radius: 11px; background: {{it.bg}}; color: {{it.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: 700;">{{it.tag}}</span>
              <span style="flex-grow: 1; font-size: 14px; font-weight: 600;">{{it.name}}</span>
              <span style="font-size: 12px; color: var(--muted);">{{it.hint}}</span>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <button type="button" style="min-height: 48px; border-radius: 14px; border: 1px solid var(--danger-line); background: var(--surface); color: var(--danger-ink); font-size: 14px; font-weight: 700;">ออกจากระบบ</button>
  </div>

  <nav style="flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 12px 18px; background: var(--surface); border-top: 1px solid var(--line);">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 11px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 11 8-6.5 8 6.5"></path><path d="M6.5 9.8V19.5h11V9.8"></path></svg>หน้าแรก</a>
    <a href="Customer-Activity.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 11px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8z"></path><path d="M9.5 9h5"></path><path d="M9.5 13h5"></path></svg>กิจกรรม</a>
    <a href="Customer-Wallet.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 11px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5.5A2.5 2.5 0 0 1 3 16.5z"></path><path d="M16.2 12.5H19"></path></svg>กระเป๋าเงิน</a>
    <span aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--link); font-size: 11px; font-weight: 700;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>บัญชี</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const gold = { bg: 'var(--brand-soft)', fg: 'var(--brand-on-soft)' };
    const green = { bg: 'var(--green-soft)', fg: 'var(--green-ink)' };
    const teal = { bg: 'var(--teal-soft)', fg: 'var(--teal-ink)' };
    const grey = { bg: 'var(--sunken)', fg: 'var(--muted)' };
    return {
      groups: [
        { title: 'เงินและรางวัล', items: [
          { tag: 'WL', name: 'Wallet / เติมเงิน', hint: '฿1,240', href: 'Customer-Wallet.dc.html', ...gold },
          { tag: 'CP', name: 'คูปองของฉัน', hint: '3 ใบ', href: 'Customer-Coupons.dc.html', ...gold },
          { tag: 'RF', name: 'ชวนเพื่อนรับรางวัล', hint: 'ขั้น 2', href: 'Customer-Referral.dc.html', ...green }
        ]},
        { title: 'การตั้งค่า', items: [
          { tag: 'AD', name: 'ที่อยู่ที่บันทึกไว้', hint: '3 ที่', href: 'Customer-SavedAddresses.dc.html', ...teal },
          { tag: 'HP', name: 'ศูนย์ช่วยเหลือ', hint: '', href: 'Customer-Help.dc.html', ...grey },
          { tag: 'TK', name: 'เรื่องที่แจ้งไว้', hint: '1 เรื่อง', href: 'Customer-SupportTickets.dc.html', ...grey }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
