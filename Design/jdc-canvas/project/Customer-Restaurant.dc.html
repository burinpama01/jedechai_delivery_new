<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ลูกค้า — หน้าร้านและเมนู</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --paper:#f4f7f4;--surface:#ffffff;--sunken:#eef2ee;--line:#dbe4de;
  --text:#0f3b33;--muted:#5c6f68;--dim:#66736d;
  --panel:#0f3b33;--on-panel:#ffffff;--panel-dim:#b7cfc8;
  --panel-soft:rgba(255,255,255,.10);--panel-soft2:rgba(255,255,255,.12);--panel-soft3:rgba(255,255,255,.14);--panel-line:rgba(255,255,255,.24);--bar-dim:rgba(255,255,255,.26);
  --brand:#e39c2e;--brand-hi:#f3c06a;--cta:#8a5a0a;--on-cta:#ffffff;--link:#8a5a0a;--link-hover:#6d4708;
  --brand-soft:#fff3dc;--brand-soft2:#fffaf0;--brand-line:#f0cf95;--brand-on-soft:#8a5a0a;
  --green-ink:#2b6b2b;--green-soft:#e6f4e2;--green-line:#bfe0b6;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.30);--green-panel-line:rgba(95,207,122,.45);
  --teal-soft:#e2f1ef;--teal-ink:#16605a;
  --danger:#b42318;--danger-ink:#8f1c14;--danger-soft:#ffece9;--danger-line:#f0b3ab;
  --off-track:#c3ccc6;--knob:#ffffff;--track-empty:#e1e8e3;
  --map-bg:#dfe7e2;--map-grid:#d4ded8;--map-road:#ffffff;--route:#8a5a0a;
  --hero:linear-gradient(132deg,#0e382f 0%,#1d5f50 55%,#8a5a0a 150%);
  --hero2:linear-gradient(140deg,#0e382f 0%,#1a5548 70%);
  --hero3:linear-gradient(140deg,#0e382f 0%,#20655a 55%,#8a5a0a 140%);
  --sh-card:0 6px 18px rgba(12,44,37,.07);--sh-raise:0 12px 30px rgba(12,44,37,.10);--sh-float:0 6px 16px rgba(12,44,37,.16);--sh-deep:0 10px 24px rgba(12,44,37,.30);--sh-sheet:0 -10px 30px rgba(12,44,37,.08);--sh-brand:0 10px 26px rgba(227,156,46,.22);--sh-brand-lg:0 14px 34px rgba(227,156,46,.26);
}
/* โหมดมืด: ตอนนี้ปิดการสลับอัตโนมัติไว้ เปิดได้โดยใส่ data-theme="dark" ที่ :root */
:root[data-theme="dark"]{
  --paper:#0b1a17;--surface:#12241f;--sunken:#0e1f1b;--line:#24403a;
  --text:#e8f1ed;--muted:#9cb1a9;--dim:#8fa39c;
  --panel:#16352e;--on-panel:#f2f8f5;--panel-dim:#9ab6ae;
  --panel-soft:rgba(255,255,255,.08);--panel-soft2:rgba(255,255,255,.10);--panel-soft3:rgba(255,255,255,.12);--panel-line:rgba(255,255,255,.18);--bar-dim:rgba(255,255,255,.24);
  --brand:#e0a53f;--brand-hi:#f3c06a;--cta:#a0690f;--on-cta:#ffffff;--link:#edbb62;--link-hover:#f6d493;
  --brand-soft:#2a2114;--brand-soft2:#241d12;--brand-line:#4a3a1c;--brand-on-soft:#edbb62;
  --green-ink:#85cf82;--green-soft:#14301c;--green-line:#26512a;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.32);--green-panel-line:rgba(95,207,122,.40);
  --teal-soft:#0f2a28;--teal-ink:#6fc3ba;
  --danger:#ff8a7d;--danger-ink:#ff9a8e;--danger-soft:#351a17;--danger-line:#55302b;
  --off-track:#3a4d47;--knob:#f2f8f5;--track-empty:#24403a;
  --map-bg:#17302a;--map-grid:#1e3b34;--map-road:#25453d;--route:#e0a53f;
  --hero:linear-gradient(132deg,#0a2621 0%,#134137 55%,#5e3f0b 150%);
  --hero2:linear-gradient(140deg,#0a2621 0%,#123b33 70%);
  --hero3:linear-gradient(140deg,#0a2621 0%,#154439 55%,#5e3f0b 140%);
  --sh-card:0 6px 18px rgba(0,0,0,.40);--sh-raise:0 12px 30px rgba(0,0,0,.45);--sh-float:0 6px 16px rgba(0,0,0,.45);--sh-deep:0 10px 24px rgba(0,0,0,.55);--sh-sheet:0 -10px 30px rgba(0,0,0,.40);--sh-brand:0 10px 26px rgba(0,0,0,.45);--sh-brand-lg:0 14px 34px rgba(0,0,0,.50);
}
body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;margin:0}
.dsp{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); overflow: hidden;">

  <div style="flex-shrink: 0; height: 168px; padding: 18px 20px; box-sizing: border-box; background: var(--hero3); color: var(--on-panel); display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="Main.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--panel-line); background: var(--panel-soft2); color: var(--on-panel); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <span style="flex-grow: 1;"></span>
      <button type="button" aria-label="บันทึกร้านโปรด" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--panel-line); background: var(--panel-soft2); color: var(--on-panel); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-6.8-4.3-6.8-9A3.8 3.8 0 0 1 12 8.6 3.8 3.8 0 0 1 18.8 11c0 4.7-6.8 9-6.8 9z"></path></svg>
      </button>
    </div>
    <span style="flex-grow: 1;"></span>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; color: var(--brand-hi);">เปิดอยู่ · ปิด 21:00 น.</span>
  </div>

  <div style="flex-shrink: 0; margin: -34px 20px 0; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-raise); display: flex; flex-direction: column; gap: 10px;">
    <h1 style="font-size: 20px; font-weight: 700;">ครัวป้าน้อย</h1>
    <p style="margin: 0; font-size: 12px; color: var(--muted);">อาหารตามสั่ง · ก๋วยเตี๋ยว · 1.2 กม. จากคุณ</p>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-on-soft); font-size: 12px; font-weight: 700;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 4.5 2.3 4.8 5.2.7-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2L4.5 10l5.2-.7z"></path></svg>4.8 (326)</span>
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--sunken); color: var(--text); font-size: 12px; font-weight: 600;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 7.6V12l3 1.8"></path></svg>18–25 นาที</span>
      <span style="display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green-ink); font-size: 12px; font-weight: 700;">ค่าส่ง ฿15</span>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; gap: 8px; padding: 16px 20px 12px; overflow: hidden;">
    <span style="padding: 8px 14px; border-radius: 999px; background: var(--panel); color: var(--on-panel); font-size: 13px; font-weight: 700; white-space: nowrap;">แนะนำ</span>
    <span style="padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap;">ข้าวจานเดียว</span>
    <span style="padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap;">ก๋วยเตี๋ยว</span>
    <span style="padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap;">เครื่องดื่ม</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <sc-for list="{{dishes}}" as="d" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);">
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 700;">{{d.name}}</span>
          <span style="font-size: 12px; color: var(--muted);">{{d.desc}}</span>
          <span class="dsp" style="font-size: 15px; font-weight: 700; color: var(--link);">{{d.price}}</span>
        </span>
        <button type="button" aria-label="เพิ่มลงตะกร้า" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; border: 0; background: var(--panel); color: var(--on-panel); display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12"></path><path d="M6 12h12"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 20px; background: var(--surface); border-top: 1px solid var(--line);">
    <a href="Customer-Checkout.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 18px; border-radius: 16px; background: var(--cta); color: var(--on-panel);">
      <span style="display: flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; background: var(--panel-soft3); font-size: 13px; font-weight: 700;">2</span>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700;">ดูตะกร้า</span>
      <span class="dsp" style="font-size: 16px; font-weight: 700;">฿175</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dishes: [
        { name: 'ข้าวกะเพราหมูสับไข่ดาว', desc: 'เผ็ดกลาง · ไข่ดาวกรอบ', price: '฿65' },
        { name: 'ก๋วยเตี๋ยวต้มยำน้ำข้น', desc: 'เส้นเล็ก · หมูสับ + ลูกชิ้น', price: '฿60' },
        { name: 'ข้าวผัดอเมริกัน', desc: 'ไก่ทอด · ไส้กรอก · ไข่ดาว', price: '฿85' },
        { name: 'ชาเย็นสูตรร้าน', desc: 'หวานน้อย · เพิ่มมุกได้', price: '฿35' }
      ]
    };
  }
}
</script>
</body>
</html>
