<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>คนขับ — งานปัจจุบัน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --paper:#f4f7f4;--surface:#ffffff;--sunken:#eef2ee;--line:#dbe4de;
  --text:#0f3b33;--muted:#5c6f68;--dim:#66736d;
  --panel:#0f3b33;--on-panel:#ffffff;--panel-dim:#b7cfc8;
  --panel-soft:rgba(255,255,255,.10);--panel-soft2:rgba(255,255,255,.12);--panel-soft3:rgba(255,255,255,.14);--panel-line:rgba(255,255,255,.24);--bar-dim:rgba(255,255,255,.26);
  --brand:#e39c2e;--brand-hi:#f3c06a;--cta:#8a5a0a;--on-cta:#ffffff;--link:#8a5a0a;--link-hover:#6d4708;
  --brand-soft:#fff3dc;--brand-soft2:#fffaf0;--brand-line:#f0cf95;--brand-on-soft:#8a5a0a;
  --green-ink:#2b6b2b;--green-soft:#e6f4e2;--green-line:#bfe0b6;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.30);--green-panel-line:rgba(95,207,122,.45);
  --teal-soft:#e2f1ef;--teal-ink:#16605a;
  --danger:#b42318;--danger-ink:#8f1c14;--danger-soft:#ffece9;--danger-line:#f0b3ab;
  --off-track:#c3ccc6;--knob:#ffffff;--track-empty:#e1e8e3;
  --map-bg:#dfe7e2;--map-grid:#d4ded8;--map-road:#ffffff;--route:#8a5a0a;
  --hero:linear-gradient(132deg,#0e382f 0%,#1d5f50 55%,#8a5a0a 150%);
  --hero2:linear-gradient(140deg,#0e382f 0%,#1a5548 70%);
  --hero3:linear-gradient(140deg,#0e382f 0%,#20655a 55%,#8a5a0a 140%);
  --sh-card:0 6px 18px rgba(12,44,37,.07);--sh-raise:0 12px 30px rgba(12,44,37,.10);--sh-float:0 6px 16px rgba(12,44,37,.16);--sh-deep:0 10px 24px rgba(12,44,37,.30);--sh-sheet:0 -10px 30px rgba(12,44,37,.08);--sh-brand:0 10px 26px rgba(227,156,46,.22);--sh-brand-lg:0 14px 34px rgba(227,156,46,.26);
}
/* โหมดมืด: ตอนนี้ปิดการสลับอัตโนมัติไว้ เปิดได้โดยใส่ data-theme="dark" ที่ :root */
:root[data-theme="dark"]{
  --paper:#0b1a17;--surface:#12241f;--sunken:#0e1f1b;--line:#24403a;
  --text:#e8f1ed;--muted:#9cb1a9;--dim:#8fa39c;
  --panel:#16352e;--on-panel:#f2f8f5;--panel-dim:#9ab6ae;
  --panel-soft:rgba(255,255,255,.08);--panel-soft2:rgba(255,255,255,.10);--panel-soft3:rgba(255,255,255,.12);--panel-line:rgba(255,255,255,.18);--bar-dim:rgba(255,255,255,.24);
  --brand:#e0a53f;--brand-hi:#f3c06a;--cta:#a0690f;--on-cta:#ffffff;--link:#edbb62;--link-hover:#f6d493;
  --brand-soft:#2a2114;--brand-soft2:#241d12;--brand-line:#4a3a1c;--brand-on-soft:#edbb62;
  --green-ink:#85cf82;--green-soft:#14301c;--green-line:#26512a;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.32);--green-panel-line:rgba(95,207,122,.40);
  --teal-soft:#0f2a28;--teal-ink:#6fc3ba;
  --danger:#ff8a7d;--danger-ink:#ff9a8e;--danger-soft:#351a17;--danger-line:#55302b;
  --off-track:#3a4d47;--knob:#f2f8f5;--track-empty:#24403a;
  --map-bg:#17302a;--map-grid:#1e3b34;--map-road:#25453d;--route:#e0a53f;
  --hero:linear-gradient(132deg,#0a2621 0%,#134137 55%,#5e3f0b 150%);
  --hero2:linear-gradient(140deg,#0a2621 0%,#123b33 70%);
  --hero3:linear-gradient(140deg,#0a2621 0%,#154439 55%,#5e3f0b 140%);
  --sh-card:0 6px 18px rgba(0,0,0,.40);--sh-raise:0 12px 30px rgba(0,0,0,.45);--sh-float:0 6px 16px rgba(0,0,0,.45);--sh-deep:0 10px 24px rgba(0,0,0,.55);--sh-sheet:0 -10px 30px rgba(0,0,0,.40);--sh-brand:0 10px 26px rgba(0,0,0,.45);--sh-brand-lg:0 14px 34px rgba(0,0,0,.50);
}
body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;margin:0}
.dsp{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); overflow: hidden;">

  <div style="flex-shrink: 0; height: 268px; position: relative; background: var(--map-bg); overflow: hidden;">
    <div style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--map-grid) 0 1px, transparent 1px 46px), repeating-linear-gradient(0deg, var(--map-grid) 0 1px, transparent 1px 46px);"></div>
    <div style="position: absolute; left: -40px; top: 150px; width: 470px; height: 18px; background: var(--map-road); transform: rotate(-6deg);"></div>
    <div style="position: absolute; left: 214px; top: -40px; width: 16px; height: 360px; background: var(--map-road); transform: rotate(8deg);"></div>
    <svg width="390" height="268" viewBox="0 0 390 268" fill="none" style="position: absolute; inset: 0;" aria-hidden="true">
      <path d="M92 214c54 0 64-58 112-72s104-6 140-34" stroke="currentColor" style="color: var(--route);" stroke-width="6" stroke-linecap="round"></path>
    </svg>
    <span style="position: absolute; left: 76px; top: 198px; width: 32px; height: 32px; border-radius: 999px; background: var(--panel); border: 3px solid var(--map-road); box-shadow: var(--sh-deep);"></span>

    <div style="position: absolute; top: 18px; left: 20px; right: 20px; display: flex; align-items: center; gap: 10px;">
      <a href="Driver-Home.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: var(--sh-float); display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <span style="flex-grow: 1;"></span>
      <a href="Driver-Navigation.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: var(--sh-float); font-size: 13px; font-weight: 700;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20 4-7.5 16-2.2-6.3L4 11.5z"></path></svg>
        นำทาง
      </a>
    </div>

    <div style="position: absolute; left: 20px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--panel); color: var(--on-panel); box-shadow: var(--sh-deep);">
      <span class="dsp" style="font-size: 18px; font-weight: 700;">1.1 กม.</span>
      <span style="width: 1px; height: 18px; background: var(--panel-line);"></span>
      <span style="font-size: 13px; color: var(--brand-hi);">ถึงร้านใน 4 นาที</span>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; margin-top: -22px; padding: 20px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 16px; box-shadow: var(--sh-sheet);">

    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="padding: 6px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-on-soft); font-size: 12px; font-weight: 700;">ขั้นที่ 1 จาก 3</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 12px; font-weight: 700; color: var(--muted);">#JD-2841</span>
    </div>

    <h1 style="font-size: 21px; font-weight: 700;">ไปรับอาหารที่ครัวป้าน้อย</h1>

    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line);">
      <span style="width: 34px; height: 34px; border-radius: 11px; background: var(--surface); color: var(--link); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.3 7-11a7 7 0 1 0-14 0c0 5.7 7 11 7 11z"></path><circle cx="12" cy="10" r="2.6"></circle></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 700;">ครัวป้าน้อย</span>
        <span style="font-size: 12px; color: var(--muted);">123/4 ถ.ศรีจันทร์ ต.ในเมือง · รับที่เคาน์เตอร์หน้าร้าน</span>
      </span>
      <a href="#call-shop" aria-label="โทรหาร้าน" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: var(--panel); color: var(--on-panel); display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5h3l1.4 3.5-2 1.3a10.5 10.5 0 0 0 5.3 5.3l1.3-2 3.5 1.4v3a1.5 1.5 0 0 1-1.7 1.5C10.9 17.8 6.2 13.1 5 6.2A1.5 1.5 0 0 1 6.5 4.5z"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
        <span style="width: 22px; height: 22px; border-radius: 7px; background: var(--sunken); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">1</span>
        <span style="flex-grow: 1; font-weight: 600;">ข้าวกะเพราหมูสับไข่ดาว</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
        <span style="width: 22px; height: 22px; border-radius: 7px; background: var(--sunken); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">2</span>
        <span style="flex-grow: 1; font-weight: 600;">ชาเย็นสูตรร้าน</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 16px; background: var(--green-soft); border: 1px solid var(--green-line);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--green-ink);" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="m8.5 12.3 2.4 2.4 4.6-4.9"></path></svg>
      <span style="flex-grow: 1; font-size: 13px; font-weight: 600; color: var(--green-ink);">ลูกค้าจ่ายแล้ว ไม่ต้องเก็บเงินปลายทาง</span>
    </div>

    <span style="flex-grow: 1;"></span>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line);">
      <span style="flex-grow: 1; font-size: 13px; color: var(--muted);">รายได้จากงานนี้</span>
      <span class="dsp" style="font-size: 18px; font-weight: 700;">฿58.00</span>
    </div>

    <button type="button" style="min-height: 58px; border-radius: 16px; border: 0; background: var(--cta); color: var(--on-panel); font-size: 16px; font-weight: 700;">ถึงร้านแล้ว · รับอาหาร</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
