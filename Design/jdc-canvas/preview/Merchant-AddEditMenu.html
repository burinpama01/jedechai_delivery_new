<!doctype html><html lang="th"><head><meta charset="utf-8"><title>Merchant-AddEditMenu</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>
:root{color-scheme:light;
  --paper:#f4f7f4;--surface:#ffffff;--sunken:#eef2ee;--line:#dbe4de;
  --text:#0f3b33;--muted:#5c6f68;--dim:#66736d;
  --panel:#0f3b33;--on-panel:#ffffff;--panel-dim:#b7cfc8;
  --panel-soft:rgba(255,255,255,.10);--panel-soft2:rgba(255,255,255,.12);--panel-soft3:rgba(255,255,255,.14);--panel-line:rgba(255,255,255,.24);--bar-dim:rgba(255,255,255,.26);
  --brand:#e39c2e;--brand-hi:#f3c06a;--cta:#8a5a0a;--on-cta:#ffffff;--link:#8a5a0a;--link-hover:#6d4708;
  --brand-soft:#fff3dc;--brand-soft2:#fffaf0;--brand-line:#f0cf95;--brand-on-soft:#8a5a0a;
  --green-ink:#2b6b2b;--green-soft:#e6f4e2;--green-line:#bfe0b6;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.30);--green-panel-line:rgba(95,207,122,.45);
  --teal-soft:#e2f1ef;--teal-ink:#16605a;
  --danger:#b42318;--danger-ink:#8f1c14;--danger-soft:#ffece9;--danger-line:#f0b3ab;
  --off-track:#c3ccc6;--knob:#ffffff;--track-empty:#e1e8e3;
  --map-bg:#dfe7e2;--map-grid:#d4ded8;--map-road:#ffffff;--route:#8a5a0a;
  --hero:linear-gradient(132deg,#0e382f 0%,#1d5f50 55%,#8a5a0a 150%);
  --hero2:linear-gradient(140deg,#0e382f 0%,#1a5548 70%);
  --hero3:linear-gradient(140deg,#0e382f 0%,#20655a 55%,#8a5a0a 140%);
  --sh-card:0 6px 18px rgba(12,44,37,.07);--sh-raise:0 12px 30px rgba(12,44,37,.10);--sh-float:0 6px 16px rgba(12,44,37,.16);--sh-deep:0 10px 24px rgba(12,44,37,.30);--sh-sheet:0 -10px 30px rgba(12,44,37,.08);--sh-brand:0 10px 26px rgba(227,156,46,.22);--sh-brand-lg:0 14px 34px rgba(227,156,46,.26);
}
/* โหมดมืด: ตอนนี้ปิดการสลับอัตโนมัติไว้ เปิดได้โดยใส่ data-theme="dark" ที่ :root */
:root[data-theme="dark"]{
  --paper:#0b1a17;--surface:#12241f;--sunken:#0e1f1b;--line:#24403a;
  --text:#e8f1ed;--muted:#9cb1a9;--dim:#8fa39c;
  --panel:#16352e;--on-panel:#f2f8f5;--panel-dim:#9ab6ae;
  --panel-soft:rgba(255,255,255,.08);--panel-soft2:rgba(255,255,255,.10);--panel-soft3:rgba(255,255,255,.12);--panel-line:rgba(255,255,255,.18);--bar-dim:rgba(255,255,255,.24);
  --brand:#e0a53f;--brand-hi:#f3c06a;--cta:#a0690f;--on-cta:#ffffff;--link:#edbb62;--link-hover:#f6d493;
  --brand-soft:#2a2114;--brand-soft2:#241d12;--brand-line:#4a3a1c;--brand-on-soft:#edbb62;
  --green-ink:#85cf82;--green-soft:#14301c;--green-line:#26512a;--green-fill:#2e7d43;--green-dot:#5fcf7a;--green-on-panel:#a8e0b4;--green-panel:rgba(46,125,67,.32);--green-panel-line:rgba(95,207,122,.40);
  --teal-soft:#0f2a28;--teal-ink:#6fc3ba;
  --danger:#ff8a7d;--danger-ink:#ff9a8e;--danger-soft:#351a17;--danger-line:#55302b;
  --off-track:#3a4d47;--knob:#f2f8f5;--track-empty:#24403a;
  --map-bg:#17302a;--map-grid:#1e3b34;--map-road:#25453d;--route:#e0a53f;
  --hero:linear-gradient(132deg,#0a2621 0%,#134137 55%,#5e3f0b 150%);
  --hero2:linear-gradient(140deg,#0a2621 0%,#123b33 70%);
  --hero3:linear-gradient(140deg,#0a2621 0%,#154439 55%,#5e3f0b 140%);
  --sh-card:0 6px 18px rgba(0,0,0,.40);--sh-raise:0 12px 30px rgba(0,0,0,.45);--sh-float:0 6px 16px rgba(0,0,0,.45);--sh-deep:0 10px 24px rgba(0,0,0,.55);--sh-sheet:0 -10px 30px rgba(0,0,0,.40);--sh-brand:0 10px 26px rgba(0,0,0,.45);--sh-brand-lg:0 14px 34px rgba(0,0,0,.50);
}
body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;margin:0}
.dsp{font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style><style>body{margin:0;display:flex;justify-content:center;background:#8a8f8c}</style></head><body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 16px 16px 14px; background: var(--surface); border-bottom: 1px solid var(--line);">
    <a href="Merchant-Menu.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; border: 1px solid var(--line); color: var(--text); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--text);" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
      <h1 class="dsp" style="font-size: 17px; font-weight: 700;">แก้ไขเมนู</h1>
      <span style="font-size: 12px; color: var(--muted);">ข้าวกะเพราหมูสับ</span>
    </span>
    <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--danger-line); background: var(--surface); color: var(--danger); font-size: 13px; font-weight: 700;">ลบ</button>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 16px; background: var(--sunken); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 8.5h3l1.3-2h6.4l1.3 2h3v10h-15z"></path><circle cx="12" cy="13" r="3.3"></circle></svg></span>
      <span style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
        <span style="font-size: 12px; color: var(--muted); line-height: 1.5;">รูปสี่เหลี่ยมจัตุรัส อย่างน้อย 800×800 px</span>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 700;">เปลี่ยนรูป</button>
      </span>
    </div>
    <label for="name" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 600; color: var(--muted);">ชื่อเมนู</span>
      <input id="name" type="text" value="ข้าวกะเพราหมูสับ" style="min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 14px; padding: 0 14px;">
    </label>
    <label for="desc" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 600; color: var(--muted);">รายละเอียด</span>
      <textarea id="desc" rows="2" data-trim="1" style="border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 14px; padding: 10px 14px; resize: none;">หมูสับผัดกะเพราไฟแรง เสิร์ฟพร้อมข้าวสวยร้อน</textarea>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <label for="price" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 600; color: var(--muted);">ราคา (บาท)</span>
      <input id="price" type="number" value="65" style="min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 14px; padding: 0 14px;">
    </label>
    <label for="prep" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 600; color: var(--muted);">เวลาเตรียม (นาที)</span>
      <input id="prep" type="number" value="15" style="min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 14px; padding: 0 14px;">
    </label>
    </div>
    <label for="cat" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 600; color: var(--muted);">หมวดหมู่</span>
      <select id="cat" style="min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 14px; padding: 0 12px;">
        <option selected>อาหารตามสั่ง</option>
        <option>ก๋วยเตี๋ยว</option>
        <option>เครื่องดื่ม</option>
        <option>ของหวาน</option>
        <option>ฟาสต์ฟู้ด</option>
        <option>อื่นๆ</option>
      </select>
    </label>
    <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px;">
      <h2 class="dsp" style="flex-grow: 1; font-size: 14px; font-weight: 700;">กลุ่มตัวเลือกเสริม</h2>
      <a href="Merchant-OptionLibrary.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 700;">เพิ่มจากคลัง</a>
    </div>
    <a href="Merchant-OptionGroup.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--text);">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 700;">ระดับความเผ็ด</span>
        <span style="font-size: 12px; color: var(--muted);">เลือก 1 อย่าง · บังคับเลือก</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <button type="button" role="switch" aria-checked="true" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-align: left;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 700;">เปิดขายเมนูนี้</span>
        <span style="font-size: 12px; color: var(--muted);">ปิดชั่วคราวเมื่อของหมด</span>
      </span>
      <span style="width: 50px; height: 30px; border-radius: 999px; background: var(--green-fill); padding: 3px; display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0;"><span style="width: 24px; height: 24px; border-radius: 999px; background: var(--knob);"></span></span>
    </button>
  </div>
  <div style="flex-shrink: 0; padding: 12px 20px 20px; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--sh-sheet); display: flex; flex-direction: column; gap: 10px;">
    <a href="Merchant-Menu.dc.html" style="min-height: 52px; border-radius: 16px; background: var(--cta); color: var(--on-cta); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">บันทึกเมนู</a>
  </div>
</div>
</body></html>
